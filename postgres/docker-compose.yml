services:
  db:
    image: docker.io/library/postgres:18
    restart: always
    ports:
      - 5434:5432
    volumes:
      - /volume1/my_apps/postgres/data/pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - db-net

networks:
  db-net:
    external: true
